<!DOCTYPE html>
<html lang="ru" data-theme="dark">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>QR — FINA Points Borozdov</title>
    <meta name="robots" content="noindex">

    <!-- PWA & Icons -->
    <link rel="icon" href="/assets/img/favicon.png" type="image/png">
    <link rel="icon" href="/assets/img/icon-192.png" type="image/png" sizes="192x192">
    <link rel="apple-touch-icon" href="/assets/img/apple-touch-icon.png">
    <link rel="manifest" href="/manifest.json">
    <meta name="theme-color" content="#0d0d0d">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="FINA QR">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">

    <script>
        (function () {
            try {
                var stored = localStorage.getItem('fina_lik');
                var theme = (stored === 'dark' || stored === 'light')
                    ? stored
                    : (window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark');
                document.documentElement.setAttribute('data-theme', theme);
                document.documentElement.setAttribute('data-theme-mode', stored || 'auto');
            } catch (e) { }
        })();
    </script>
    <style>
        /* ===== Tokens ===== */
        :root {
            --font: 'Inter', system-ui, -apple-system, sans-serif;
            --tr: 0.15s ease;
        }

        [data-theme="dark"] {
            --canvas: #0d0d0d;
            --inset: #121212;
            --surface: #1a1a1a;
            --border: #2e2e2e;
            --border-strong: #6b6b6b;
            --slate: #8a8a8a;
            --soft: #d1d1d1;
            --text: #fafafa;
            --ring: rgba(250, 250, 250, 0.22);
        }

        [data-theme="light"] {
            --canvas: #fafafa;
            --inset: #ececec;
            --surface: #ffffff;
            --border: #e4e4e4;
            --border-strong: #8a8a8a;
            --slate: #6b6b6b;
            --soft: #3d3d3d;
            --text: #0d0d0d;
            --ring: rgba(13, 13, 13, 0.22);
        }

        *,
        *::before,
        *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
        }

        html,
        body {
            height: 100%;
            font-family: var(--font);
            background: var(--canvas);
            color: var(--text);
            -webkit-font-smoothing: antialiased;
            overflow: hidden;
        }

        ::selection {
            background: var(--text);
            color: var(--canvas);
        }

        /* ===== Layout ===== */
        .page {
            min-height: 100dvh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        /* ===== Card ===== */
        .card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 24px;
            max-width: 340px;
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 16px;
            text-align: center;
            animation: appear 0.3s ease;
        }

        @keyframes appear {
            from {
                opacity: 0;
                transform: translateY(12px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .logo {
            display: flex;
            flex-direction: column;
            text-decoration: none;
            line-height: 1;
            align-items: center;
        }

        .logo-top {
            font-size: 1.15rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: -0.02em;
            color: var(--text);
        }

        .logo-bottom {
            font-size: 0.55rem;
            font-weight: 500;
            text-transform: uppercase;
            letter-spacing: 0.12em;
            color: var(--slate);
            margin-top: 3px;
        }

        /* QR — константа: обсидиановые модули на титановой плашке */
        .qr-wrap {
            background: #fafafa;
            border: 1px solid var(--border);
            border-radius: 6px;
            padding: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            aspect-ratio: 1;
            max-width: 240px;
        }

        #qr-container,
        #qr-container img,
        #qr-container canvas {
            display: block;
            width: 100%;
            height: auto;
        }

        /* ===== Text ===== */
        .info {
            margin-top: 2px;
        }

        .title {
            font-size: 0.9rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: -0.01em;
            color: var(--text);
        }

        .subtitle {
            font-size: 0.8rem;
            color: var(--slate);
            margin-top: 4px;
            font-weight: 400;
        }

        /* ===== Actions ===== */
        .actions-row {
            display: flex;
            gap: 8px;
            align-items: center;
            justify-content: center;
        }

        .url-chip {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            background: transparent;
            border: 1px solid var(--border);
            border-radius: 4px;
            padding: 7px 11px;
            font-size: 0.62rem;
            font-weight: 500;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: var(--soft);
            text-decoration: none;
            white-space: nowrap;
            transition: color var(--tr), border-color var(--tr);
        }

        .url-chip:hover {
            color: var(--text);
            border-color: var(--border-strong);
        }

        .share-btn {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            background: var(--text);
            border: 1px solid var(--text);
            border-radius: 4px;
            padding: 7px 13px;
            font-size: 0.62rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            font-family: var(--font);
            color: var(--canvas);
            white-space: nowrap;
            cursor: pointer;
            transition: filter var(--tr);
        }

        .share-btn:hover {
            filter: brightness(0.85);
        }

        .share-btn:focus-visible,
        .url-chip:focus-visible,
        .theme-btn:focus-visible,
        .back-btn:focus-visible {
            outline: none;
            box-shadow: 0 0 0 3px var(--ring);
        }

        /* ===== Toast — инверсия ===== */
        .toast {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%) translateY(80px);
            background: var(--text);
            color: var(--canvas);
            border-radius: 6px;
            padding: 10px 18px;
            font-size: 0.82rem;
            font-weight: 600;
            font-family: var(--font);
            opacity: 0;
            transition: opacity 0.3s ease, transform 0.3s ease;
            z-index: 100;
            pointer-events: none;
        }

        .toast.show {
            opacity: 1;
            transform: translateX(-50%) translateY(0);
        }

        /* ===== Tags ===== */
        .tags {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            justify-content: center;
        }

        .tag {
            font-size: 0.58rem;
            font-weight: 500;
            text-transform: uppercase;
            letter-spacing: 0.12em;
            color: var(--soft);
            background: transparent;
            border: 1px solid var(--border-strong);
            border-radius: 2px;
            padding: 3px 8px;
        }

        .divider {
            width: 100%;
            height: 1px;
            background: var(--border);
        }

        /* ===== Corner buttons ===== */
        .theme-btn,
        .back-btn {
            position: fixed;
            top: 16px;
            width: 38px;
            height: 38px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: transparent;
            border: 1px solid var(--border);
            border-radius: 6px;
            cursor: pointer;
            color: var(--slate);
            text-decoration: none;
            transition: color var(--tr), border-color var(--tr);
            z-index: 10;
        }

        .theme-btn {
            right: 16px;
        }

        .back-btn {
            left: 16px;
        }

        .theme-btn:hover,
        .back-btn:hover {
            border-color: var(--border-strong);
            color: var(--text);
        }

        /* Тёмный → светлый → авто; иконка показывает, куда переключит клик */
        .theme-icon-sun,
        .theme-icon-moon,
        .theme-icon-auto {
            display: none;
        }

        [data-theme-mode="dark"] .theme-icon-sun {
            display: block;
        }

        [data-theme-mode="light"] .theme-icon-auto {
            display: block;
        }

        [data-theme-mode="auto"] .theme-icon-moon {
            display: block;
        }

        @media (max-height: 500px) {
            .page {
                padding: 10px;
            }

            .card {
                flex-direction: row;
                max-width: 500px;
                padding: 16px;
                gap: 20px;
            }

            .qr-wrap {
                width: 160px;
                height: 160px;
            }
        }

        @media (prefers-reduced-motion: reduce) {

            *,
            *::before,
            *::after {
                animation-duration: 0.01ms !important;
                transition-duration: 0.01ms !important;
            }
        }
    </style>
</head>

<body>
    <a href="../" class="back-btn" aria-label="Назад" title="Назад">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
            stroke-linecap="round" stroke-linejoin="round">
            <line x1="19" y1="12" x2="5" y2="12"></line>
            <polyline points="12 19 5 12 12 5"></polyline>
        </svg>
    </a>
    <button class="theme-btn" id="theme-btn" aria-label="Переключить тему">
        <svg class="theme-icon-sun" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor"
            stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <circle cx="12" cy="12" r="4"></circle>
            <path d="M12 2v2"></path>
            <path d="M12 20v2"></path>
            <path d="m4.93 4.93 1.41 1.41"></path>
            <path d="m17.66 17.66 1.41 1.41"></path>
            <path d="M2 12h2"></path>
            <path d="M20 12h2"></path>
            <path d="m6.34 17.66-1.41 1.41"></path>
            <path d="m19.07 4.93-1.41 1.41"></path>
        </svg>
        <svg class="theme-icon-moon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor"
            stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"></path>
        </svg>
        <svg class="theme-icon-auto" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor"
            stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <rect x="2" y="3" width="20" height="14" rx="2"></rect>
            <line x1="8" y1="21" x2="16" y2="21"></line>
            <line x1="12" y1="17" x2="12" y2="21"></line>
        </svg>
    </button>

    <main class="page">
        <article class="card">
            <a href="https://fina.borozdov.ru/" class="logo">
                <span class="logo-top">FINA POINTS</span>
                <span class="logo-bottom">BY BOROZDOV</span>
            </a>

            <div class="qr-wrap">
                <div id="qr-container"></div>
            </div>

            <div class="info">
                <p class="title">Калькулятор очков FINA</p>
                <p class="subtitle">Отсканируйте, чтобы открыть сайт</p>
            </div>

            <div class="actions-row">
                <a href="https://fina.borozdov.ru/" class="url-chip">
                    <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                        stroke-linecap="round" stroke-linejoin="round">
                        <circle cx="12" cy="12" r="10" />
                        <path d="M2 12h20" />
                        <path
                            d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z" />
                    </svg>
                    fina.borozdov.ru
                </a>
                <button type="button" class="share-btn" id="share-qr-btn" aria-label="Поделиться">
                    <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                        stroke-linecap="round" stroke-linejoin="round">
                        <path d="M4 12v8a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-8"></path>
                        <polyline points="16 6 12 2 8 6"></polyline>
                        <line x1="12" y1="2" x2="12" y2="15"></line>
                    </svg>
                    Поделиться
                </button>
            </div>

            <div class="divider"></div>

            <div class="tags">
                <span class="tag">PWA</span>
                <span class="tag">Оффлайн</span>
                <span class="tag">Рекорды</span>
            </div>
        </article>
    </main>

    <div class="toast" id="toast">Ссылка скопирована</div>

    <!-- QR Library -->
    <script src="/js/lib/qrcode.min.js"></script>
    <script>
        const themeBtn = document.getElementById('theme-btn');
        const themeMedia = window.matchMedia('(prefers-color-scheme: light)');
        let themeMode = (function () {
            const s = localStorage.getItem('fina_lik');
            return (s === 'dark' || s === 'light') ? s : 'auto';
        })();

        function applyThemeMode() {
            const effective = themeMode === 'auto'
                ? (themeMedia.matches ? 'light' : 'dark')
                : themeMode;
            document.documentElement.setAttribute('data-theme', effective);
            document.documentElement.setAttribute('data-theme-mode', themeMode);
        }

        // QR — константа вне зеркала: #0d0d0d на #fafafa в обоих ликах.
        // Кастомная отрисовка: жёсткая сетка модулей, монолитные «глаза»,
        // обсидиановая печать с литерой в центре (уровень коррекции H).
        function renderQR() {
            const container = document.getElementById('qr-container');
            if (!container || typeof QRCode === 'undefined') return;

            const OBSIDIAN = '#0d0d0d', TITAN = '#fafafa';

            // Матрица — из скрытого экземпляра библиотеки
            const probe = document.createElement('div');
            const qr = new QRCode(probe, {
                text: 'https://fina.borozdov.ru/',
                width: 10,
                height: 10,
                correctLevel: QRCode.CorrectLevel.H
            });
            const model = qr._oQRCode;
            if (!model) return;
            const n = model.getModuleCount();

            const cell = 16, quiet = 1;
            const size = (n + quiet * 2) * cell;
            const canvas = document.createElement('canvas');
            canvas.width = size;
            canvas.height = size;
            const ctx = canvas.getContext('2d');

            ctx.fillStyle = TITAN;
            ctx.fillRect(0, 0, size, size);

            const inEye = (r, c) => (r < 7 && c < 7) || (r < 7 && c >= n - 7) || (r >= n - 7 && c < 7);

            // Центральная печать (при H допустимо до 30% перекрытия — тут ~7%)
            const span = n >= 29 ? 9 : 7;
            const start = Math.floor((n - span) / 2), end = start + span - 1;
            const inSeal = (r, c) => r >= start && r <= end && c >= start && c <= end;

            // Модули данных — сплошные полновесные квадраты
            ctx.fillStyle = OBSIDIAN;
            for (let r = 0; r < n; r++) {
                for (let c = 0; c < n; c++) {
                    if (inEye(r, c) || inSeal(r, c) || !model.isDark(r, c)) continue;
                    ctx.fillRect((quiet + c) * cell, (quiet + r) * cell, cell, cell);
                }
            }

            // Глаза — монолит без скруглений
            const drawEye = (row, col) => {
                const x = (quiet + col) * cell, y = (quiet + row) * cell;
                ctx.fillStyle = OBSIDIAN;
                ctx.fillRect(x, y, 7 * cell, 7 * cell);
                ctx.fillStyle = TITAN;
                ctx.fillRect(x + cell, y + cell, 5 * cell, 5 * cell);
                ctx.fillStyle = OBSIDIAN;
                ctx.fillRect(x + 2 * cell, y + 2 * cell, 3 * cell, 3 * cell);
            };
            drawEye(0, 0);
            drawEye(0, n - 7);
            drawEye(n - 7, 0);

            // Печать: обсидиановый квадрат + титановая литера
            const sx = (quiet + start) * cell, sy = sx;
            const sSize = span * cell, pad = cell * 0.3;
            ctx.fillStyle = OBSIDIAN;
            if (ctx.roundRect) {
                ctx.beginPath();
                ctx.roundRect(sx + pad, sy + pad, sSize - pad * 2, sSize - pad * 2, cell * 0.4);
                ctx.fill();
            } else {
                ctx.fillRect(sx + pad, sy + pad, sSize - pad * 2, sSize - pad * 2);
            }
            ctx.fillStyle = TITAN;
            ctx.font = `600 ${Math.round(sSize * 0.5)}px Inter, system-ui, sans-serif`;
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText('F', sx + sSize / 2, sy + sSize / 2 + sSize * 0.03);

            container.innerHTML = '';
            container.appendChild(canvas);
        }

        // Литера рисуется шрифтом страницы — перерисовать, когда Inter догрузится
        if (document.fonts && document.fonts.ready) {
            document.fonts.ready.then(() => renderQR());
        }

        // Listen for theme changes from other tabs
        window.addEventListener('storage', (e) => {
            if (e.key === 'fina_lik') {
                const s = localStorage.getItem('fina_lik');
                themeMode = (s === 'dark' || s === 'light') ? s : 'auto';
                applyThemeMode();
            }
        });

        if (themeBtn) {
            // Трёхтактный цикл: тёмный → светлый → авто (по системе) → тёмный
            themeBtn.addEventListener('click', () => {
                themeMode = { dark: 'light', light: 'auto', auto: 'dark' }[themeMode] || 'dark';
                if (themeMode === 'auto') localStorage.removeItem('fina_lik');
                else localStorage.setItem('fina_lik', themeMode);
                applyThemeMode();
            });
        }

        applyThemeMode();

        // В авто-режиме следуем за системной темой вживую
        themeMedia.addEventListener('change', () => {
            if (themeMode === 'auto') applyThemeMode();
        });

        window.addEventListener('load', renderQR);

        // Share functionality
        document.getElementById('share-qr-btn').addEventListener('click', async () => {
            const shareData = {
                title: 'Калькулятор очков FINA',
                text: 'Калькулятор очков FINA — расчёт очков по времени и времени по очкам. Работает оффлайн.',
                url: 'https://fina.borozdov.ru/'
            };
            try {
                if (navigator.share) {
                    await navigator.share(shareData);
                } else {
                    await navigator.clipboard.writeText(shareData.text + '\n\n' + shareData.url);
                    showToast();
                }
            } catch (e) {
                if (e.name !== 'AbortError') {
                    try { await navigator.clipboard.writeText('https://fina.borozdov.ru/'); } catch (_) { }
                    showToast();
                }
            }
        });

        function showToast() {
            const t = document.getElementById('toast');
            if (t) {
                t.classList.add('show');
                setTimeout(() => t.classList.remove('show'), 2000);
            }
        }
    </script>
</body>

</html>
