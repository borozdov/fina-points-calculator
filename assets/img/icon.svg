<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!--
    Плашка не инвертируется. Раньше здесь стоял prefers-color-scheme, и у пользователя
    с тёмной системой вкладка получала обсидиановый квадрат с белой литерой — при том что
    все остальные иконки приложения (favicon.ico, PNG для PWA, ic_launcher и splash
    в Android) нарисованы светлыми и дарк-варианта у них нет. Литера расходилась сама
    с собой: на калькуляторе чёрная плашка, на страницах таблиц — светлая, потому что там
    объявлен только .ico. Инверсия — акцент внутри интерфейса, а знак у бренда один;
    QR-код зафиксирован в брендбуке по той же причине.
  -->
  <rect width="64" height="64" rx="12" fill="#ffffff"/>
  <path d="M18.945855626048658 51.84V12.160000000000004H45.054144373951345V18.90604016359061H27.083059799706376V29.985650167785238H43.30076538905202V36.61664964345638H27.083059799706376V51.84Z" fill="#0d0d0d"/>
</svg>
