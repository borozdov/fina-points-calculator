<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <style>
    /* Следует системной теме, а не переключателю в приложении: фавиконку браузер
       кэширует слишком цепко, чтобы она успевала за выбором лика. */
    :root { --ground: #ffffff; --mark: #0d0d0d; }
    @media (prefers-color-scheme: dark) {
      :root { --ground: #0d0d0d; --mark: #ffffff; }
    }
  </style>
  <rect width="64" height="64" rx="12" fill="var(--ground)"/>
  <path d="M18.945855626048658 51.84V12.160000000000004H45.054144373951345V18.90604016359061H27.083059799706376V29.985650167785238H43.30076538905202V36.61664964345638H27.083059799706376V51.84Z" fill="var(--mark)"/>
</svg>
